---
applications:
  - name: sdadataai-bw-rfc-mcp
    path: .
    buildpacks:
      - nodejs_buildpack
    memory: 64M
    instances: 1
    health-check-type: http
    health-check-http-endpoint: /health
    routes:
      - route: sdadataai-bw-rfc-mcp.cfapps.us10.hana.ondemand.com
    env:
      MCP_USER_1: AYMANK
      MCP_PASS_1: AYMANK
      MCP_USER_2: SAIREDDY
      MCP_PASS_2: SAIREDDY
      # Set these before first use (cf set-env, then cf restage), not committed here:
      # SDADATAAI_SAP_ASHOST / _SYSNR / _SID / _CLIENT / _USER / _PASSWD
