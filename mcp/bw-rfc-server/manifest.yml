---
applications:
  - name: sdadataai-bw-rfc-mcp
    path: .
    buildpacks:
      - nodejs_buildpack
    memory: 256M
    instances: 1
    health-check-type: http
    health-check-http-endpoint: /health
    # No public route: lab-sda_Space's CF route quota is maxed out, and this
    # server doesn't need one for cf run-task based connection testing. Add
    # a route deliberately later if the CAP backend needs to reach it over
    # HTTP from outside this space.
    no-route: true
    env:
      MCP_USER_1: AYMANK
      MCP_PASS_1: AYMANK
      MCP_USER_2: SAIREDDY
      MCP_PASS_2: SAIREDDY
      # Set these before first use (cf set-env, then cf restage), not committed here:
      # SDADATAAI_SAP_ASHOST / _SYSNR / _CLIENT / _USER / _PASSWD
